name: Build MIWG Test Suite

on:
  push:
    branches:
      - main
    paths:
      - 'bpmn-rendering-miwg-test-suite/**'
      - '.github/workflows/build-miwg-test-suite.yml'
  pull_request:
    paths:
      - 'bpmn-rendering-miwg-test-suite/**'
      - '.github/workflows/build-miwg-test-suite.yml'

defaults:
  run:
    working-directory: bpmn-rendering-miwg-test-suite

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: bpmn-rendering-miwg-test-suite/.nvmrc
          cache: npm
          cache-dependency-path: bpmn-rendering-miwg-test-suite/package-lock.json
      - name: Install dependencies
        # The build (tsc && vite build) does not need a browser; only the generate-screenshots script does.
        # Skip the Chromium download so npm ci does not hang on the playwright-chromium postinstall.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci
      - name: Build
        run: npm run build
